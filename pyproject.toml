[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-wows-asia"
version = "0.2.7"
description = "NoneBot2 WoWS 亚服战绩查询：总战绩卡、最近战绩卡（逐场记录）、账号绑定"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["nonebot", "nonebot2", "wows", "world of warships", "战舰世界"]
dependencies = [
    "nonebot2>=2.3,<3",
    "httpx>=0.27,<1",
    "pydantic>=1.10,<3",
    "nonebot-plugin-alconna>=0.50",
    "nonebot-plugin-apscheduler>=0.5",
    "nonebot-plugin-localstore>=0.7",
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/Danyuyuyuyu/nonebot-plugin-wows-asia"

[project.optional-dependencies]
test = ["nonebot2[fastapi]>=2.3,<3", "pytest>=8", "pytest-asyncio>=0.23", "nonebug>=0.4", "nonebot-adapter-onebot>=2.4"]

[tool.setuptools.packages.find]
include = ["nonebot_plugin_wows_asia*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
